<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ふでのすけのおえかきパネル！2026/10月</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;700&display=swap">
<style>
:root{--bg:#eaf0f6;--card:#fff;--ink:#16263d;--sub:#5d6b7e;--line:#d5dde7;--acc:#b8860b;--accbg:#f6e7b4;--ok:#1d7a4d;--ng:#c0392b;--hl:#fff7d6}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1824;--card:#182436;--ink:#e8eef6;--sub:#93a3b8;--line:#2a3a52;--acc:#e3b53c;--accbg:#4a3d12;--ok:#4fcf93;--ng:#ff7d6e;--hl:#2e2a14}}
:root[data-theme="dark"]{--bg:#0f1824;--card:#182436;--ink:#e8eef6;--sub:#93a3b8;--line:#2a3a52;--acc:#e3b53c;--accbg:#4a3d12;--ok:#4fcf93;--ng:#ff7d6e;--hl:#2e2a14}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",sans-serif;-webkit-text-size-adjust:100%}
main{max-width:480px;margin:0 auto;padding:14px 14px 40px}
header{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin-bottom:12px}
h1{font-size:18px;margin:0;font-weight:700;line-height:1.4}
.ver{font:700 12px inherit;font-family:inherit;border:1px solid var(--acc);color:var(--acc);background:transparent;border-radius:99px;padding:4px 10px;min-height:28px}
.sum{background:var(--card);border-radius:14px;padding:16px;border:1px solid var(--line)}
.big{display:flex;align-items:baseline;gap:6px}
.big b{font-size:38px;line-height:1;font-variant-numeric:tabular-nums}
.big span{color:var(--sub);font-size:14px}
.bar{position:relative;height:14px;border-radius:7px;background:var(--line);margin:14px 0 6px;overflow:visible}
.fill{height:100%;border-radius:7px;background:var(--acc);width:0;transition:width .3s}
.tick{position:absolute;top:-4px;width:2px;height:22px;background:var(--ng)}
.legend{display:flex;justify-content:space-between;font-size:12px;color:var(--sub)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.stats div{background:var(--bg);border-radius:10px;padding:10px}
.stats small{display:block;color:var(--sub);font-size:11px;margin-bottom:2px}
.stats strong{font-size:18px;font-variant-numeric:tabular-nums}
.pos{color:var(--ok)}.neg{color:var(--ng)}
ul{list-style:none;margin:14px 0 0;padding:0;display:grid;gap:8px}
li{display:grid;grid-template-columns:62px 1fr 1fr;gap:4px 10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
li.today{background:var(--hl);border-color:var(--acc)}
.d{font-weight:700;font-size:15px}
.d small{display:block;font-weight:400;color:var(--sub);font-size:11px}
input{width:100%;font:700 18px inherit;font-family:inherit;text-align:right;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font-variant-numeric:tabular-nums}
input:focus{outline:2px solid var(--acc);border-color:transparent}
.m{font-size:12px;color:var(--sub);text-align:right;font-variant-numeric:tabular-nums}
.m b{color:var(--ink)}
.row2{grid-column:1/-1;display:flex;justify-content:space-between;font-size:12px;color:var(--sub);font-variant-numeric:tabular-nums}
.foot{margin-top:18px;text-align:center}
.rst{background:none;border:1px solid var(--line);color:var(--sub);border-radius:8px;padding:8px 14px;font:inherit;font-size:13px}
.rst.arm{border-color:var(--ng);color:var(--ng)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center;z-index:9}
.ov.on{display:flex}
.sheet{background:var(--card);width:100%;max-width:480px;max-height:75%;overflow:auto;border-radius:18px 18px 0 0;padding:18px 18px calc(24px + env(safe-area-inset-bottom,0px))}
.sheet h2{margin:0 0 10px;font-size:17px;display:flex;justify-content:space-between;align-items:center}
.sheet h2 button{border:0;background:var(--bg);color:var(--ink);width:32px;height:32px;border-radius:50%;font-size:16px}
.rv{padding:10px 0;border-top:1px solid var(--line);font-size:14px}
.rv b{color:var(--acc)}
.rv span{color:var(--sub);font-size:12px;margin-left:6px}
.rv p{margin:4px 0 0;line-height:1.6}
</style>
</head>
<body>
<main>
  <header>
    <h1>ふでのすけのおえかきパネル！2026/10月</h1>
    <button class="ver" id="ver" aria-label="改訂履歴を開く"></button>
  </header>
  <section class="sum">
    <div class="big"><b id="tot">0</b><span>/ <span id="goal"></span> PT</span></div>
    <div class="bar"><div class="fill" id="fill"></div><div class="tick" id="tick"></div></div>
    <div class="legend"><span>0</span><span style="color:var(--ng)" id="lg"></span></div>
    <div class="stats">
      <div><small>残り(全交換まで)</small><strong id="rem">-</strong></div>
      <div><small id="pl">今日までの目標比</small><strong id="pace">-</strong></div>
    </div>
  </section>
  <ul id="list"></ul>
  <div class="foot"><button class="rst" id="rst">入力をすべて消去</button></div>
</main>

<div class="ov" id="ov"><div class="sheet" role="dialog" aria-label="改訂履歴">
  <h2>改訂履歴<button id="cl" aria-label="閉じる">✕</button></h2>
  <div id="hist"></div>
</div></div>

<script>
const VERSION="1.1.0";
const HISTORY=[
  {v:"1.1.0",d:"2026/10/02",t:["入力を「累計PT」方式に変更(ゲーム内の累計をそのまま入力)","日ごとの獲得PTと目標差を自動計算","旧データは累計に自動変換"]},
  {v:"1.0.1",d:"2026/10/01",t:["タイトルを「ふでのすけのおえかきパネル！2026/10月」に変更"]},
  {v:"1.0.0",d:"2026/10/01",t:["初版リリース","10/1〜10/14(半日)の獲得PTを日別に入力・管理","入力内容は端末に自動保存"]}
];
const KEY="pt-tracker-oct-v2",OLD="pt-tracker-oct-v1";
const GOAL=39465, RED=14915;
const TARGETS=[2825,...Array(12).fill(2970),1000];
const $=id=>document.getElementById(id);
const fmt=n=>n.toLocaleString("ja-JP");

let data={};
try{
  const cur=localStorage.getItem(KEY);
  if(cur){data=JSON.parse(cur)||{}}
  else{
    const old=JSON.parse(localStorage.getItem(OLD)||"{}")||{};
    let c=0;
    Object.keys(old).map(Number).sort((a,b)=>a-b).forEach(k=>{c+=old[k];data[k]=c});
  }
}catch(e){data={}}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){}};

$("ver").textContent="v"+VERSION;
$("goal").textContent=fmt(GOAL);
$("lg").textContent="赤字分 "+fmt(RED);
$("tick").style.left=(RED/GOAL*100)+"%";
$("hist").innerHTML=HISTORY.map(h=>`<div class="rv"><b>v${h.v}</b><span>${h.d}</span><p>${h.t.map(x=>"・"+x).join("<br>")}</p></div>`).join("");
const ov=$("ov");
$("ver").onclick=()=>ov.classList.add("on");
$("cl").onclick=()=>ov.classList.remove("on");
ov.onclick=e=>{if(e.target===ov)ov.classList.remove("on")};

const now=new Date();
const todayIdx=(now.getMonth()===9&&now.getDate()>=1&&now.getDate()<=14)?now.getDate()-1:(now.getMonth()===9&&now.getDate()>14?13:-1);

const list=$("list");
TARGETS.forEach((t,i)=>{
  const li=document.createElement("li");
  if(i===todayIdx)li.className="today";
  li.innerHTML=`<div class="d">10月${i+1}日<small>${i===13?"半日":"目標 "+fmt(t)}</small></div>
    <div class="m">${i===13?"目標 "+fmt(t)+"<br>":""}獲得 <b id="c${i}">-</b></div>
    <input id="i${i}" type="text" inputmode="numeric" pattern="[0-9]*" placeholder="累計PT" autocomplete="off" enterkeyhint="done">
    <div class="row2"><span>目標累計 ${fmt(TARGETS.slice(0,i+1).reduce((a,b)=>a+b,0))}</span><span id="f${i}"></span></div>`;
  list.appendChild(li);
  const inp=li.querySelector("input");
  if(data[i]!=null)inp.value=data[i];
  inp.addEventListener("input",()=>{
    const v=inp.value.replace(/[０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-65248)).replace(/\D/g,"");
    inp.value=v;
    if(v==="")delete data[i];else data[i]=parseInt(v,10);
    save();update();
  });
});

function update(){
  let last=-1,prev=0,tcum=0;
  TARGETS.forEach((t,i)=>{if(data[i]!=null)last=i});
  TARGETS.forEach((t,i)=>{
    tcum+=t;
    const c=$("c"+i),f=$("f"+i);
    if(data[i]!=null){
      const g=data[i]-prev;prev=data[i];
      c.textContent=(g>=0?"+":"")+fmt(g);
      const d=data[i]-tcum;
      f.textContent="目標差 "+(d>=0?"+":"")+fmt(d);f.className=d>=0?"pos":"neg";
    }else{c.textContent="-";f.textContent="";f.className=""}
  });
  const cum=last>=0?data[last]:0;
  $("tot").textContent=fmt(cum);
  $("fill").style.width=Math.min(100,cum/GOAL*100)+"%";
  const rem=GOAL-cum;
  $("rem").textContent=rem>0?fmt(rem):"達成!";
  const idx=last>=0?Math.max(last,todayIdx):todayIdx;
  if(idx<0){$("pl").textContent="目標との差";$("pace").textContent="-"}
  else{
    const tt=TARGETS.slice(0,idx+1).reduce((a,b)=>a+b,0);
    const d=cum-tt;
    $("pl").textContent="10/"+(idx+1)+"までの目標比";
    $("pace").textContent=(d>=0?"+":"")+fmt(d);
    $("pace").className=d>=0?"pos":"neg";
  }
}

const rst=$("rst");let armT;
rst.onclick=()=>{
  if(!rst.classList.contains("arm")){
    rst.classList.add("arm");rst.textContent="もう一度タップで消去";
    armT=setTimeout(()=>{rst.classList.remove("arm");rst.textContent="入力をすべて消去"},3000);
  }else{
    clearTimeout(armT);data={};save();
    TARGETS.forEach((_,i)=>$("i"+i).value="");
    rst.classList.remove("arm");rst.textContent="入力をすべて消去";update();
  }
};
update();
</script>
</body>
</html>
